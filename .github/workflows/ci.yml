name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A new push to a PR cancels the previous run, no point burning minutes on stale commits.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Format and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ruff
        run: pip install ruff

      - name: Check formatting
        run: ruff format --check .

      - name: Lint
        run: ruff check --output-format=github .

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: pytest --cov=mlblueprint --cov-report=term-missing

  minimal-install:
    name: Works with NumPy alone
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # The library must be usable with no optional dependencies installed.
      # Optional imports belong inside the functions that need them,
      # see docs/STYLE_GUIDE.md.
      - name: Install without extras
        run: pip install -e .

      - name: Import the package
        run: |
          python -c "import mlblueprint; print(mlblueprint.__version__)"
          python -c "import mlblueprint.core as c; print(sorted(c.__all__))"

  examples:
    name: Examples run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      # Every algorithm's example.py must run offline without errors.
      - name: Run every example
        run: |
          shopt -s globstar nullglob
          examples=(mlblueprint/**/example.py)
          if [ ${#examples[@]} -eq 0 ]; then
            echo "No examples yet, nothing to run."
            exit 0
          fi
          for example in "${examples[@]}"; do
            echo "::group::$example"
            python "$example"
            echo "::endgroup::"
          done
        shell: bash
        env:
          MPLBACKEND: Agg
