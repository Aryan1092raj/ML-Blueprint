[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mlblueprint"
version = "0.0.1"
description = "Machine learning algorithms written so you can understand them."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "ACM IIT Mandi" }]

# NumPy is the only thing the library itself needs. Everything else below is optional.
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
science = ["scipy>=1.10", "scikit-learn>=1.3", "matplotlib>=3.7"]  # used to check our answers
viz = ["streamlit>=1.30", "matplotlib>=3.7"]                        # the visualiser app
torch = ["torch>=2.0"]                                              # only where it's needed
dev = ["mlblueprint[science,viz]", "pytest>=7.4", "pytest-cov>=4.1", "ruff>=0.6"]

[project.urls]
Homepage = "https://github.com/ACM-IIT-Mandi/ML-Blueprint"
Issues = "https://github.com/ACM-IIT-Mandi/ML-Blueprint/issues"

[tool.hatch.build.targets.wheel]
packages = ["mlblueprint"]

# Ruff does both formatting and linting, one tool, one config.
[tool.ruff]
line-length = 88

[tool.ruff.lint]
# Errors, imports, modern syntax, docstrings. Naming conventions (the "N" rules)
# are left out on purpose, short names like X, y, w are normal here.
select = ["E", "F", "I", "UP", "D"]
ignore = [
    "D107", # __init__ is documented on the class instead
    "D203", # conflicts with D211, pick one
    "D213", # conflicts with D212, pick one
    "E741", # short names like X, y, w are fine, see docs/STYLE_GUIDE.md
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]      # tests don't need full docstrings
"**/example.py" = ["D"] # neither do examples

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.pytest.ini_options]
testpaths = ["tests", "mlblueprint"]
addopts = "-ra"
